name: Build TONONKIRA APTM APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TONONKIRA_APTM_source_v2.zip -d source
          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle introuvable"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java version
        run: |
          FILE="$PROJECT_DIR/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/VERSION_1_8/VERSION_17/g' "$FILE"
          else
            FILE="$PROJECT_DIR/app/build.gradle.kts"
            if [ -f "$FILE" ]; then
              sed -i 's/VERSION_1_8/VERSION_17/g' "$FILE"
            else
              echo "Fichier Gradle introuvable"
              exit 1
            fi
          fi

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TONONKIRA-APTM-APK
          path: source/**/build/outputs/apk/debug/*.apk
