name: Build TONONKIRA APTM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TONONKIRA_APTM_source_v2.zip -d source
          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Fichier settings.gradle introuvable"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      -       - name: Fix Java 17 compatibility
        run      - name: Fix Java and Kotlin targets
        run: |
          find "$PROJECT_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print
          find "$PROJECT_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \;
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug
      - name: Collect APK
        run: |
          mkdir -p apk
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk/ \;
          ls -l apk
          test -n "$(find apk -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TONONKIRA-APTM-APK
          path: apk/*.apk
- name: Configure Java 17
  run: |
    FILE="$PROJECT_DIR/app/build.gradle"
    if [ -f "$FILE" ]; then
      sed -i '/compileOptions[[:space:]]*{/a\        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17' "$FILE"
    fi

-       - name: Fix Java 17 compatibility
        run: |
          APP_GRADLE=""
          for f in "$PROJECT_DIR/app/build.gradle" "$PROJECT_DIR/app/build.gradle.kts"; do
            if [ -f "$f" ]; then
              APP_GRADLE="$f"
              break
            fi
          done
          if [ -z "$APP_GRADLE" ]; then
            echo "Fichier Gradle app introuvable"
            exit 1
          fi
          sed -i 's/VERSION_1_8/VERSION_17/g' "$APP_GRADLE"
          echo "Fichier corrigé : $APP_GRADLE"
          grep -n -E 'sourceCompatibility|targetCompatibility|jvmTarget' "$APP_GRADLE" || true

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

