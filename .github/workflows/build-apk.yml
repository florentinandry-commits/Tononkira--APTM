
name: Build TONONKIRA APTM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o -q TONONKIRA_APTM_source_v2.zip -d source

          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle introuvable"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projet hita tao amin'ny: $PROJECT_DIR"

      - name: Fix Java and Kotlin targets
        run: |
          find "$PROJECT_DIR" -type f \( -name build.gradle -o -name build.gradle.kts \) -exec sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
            -e "s/jvmTarget = '1.8'/jvmTarget = '17'/g" {} \;

          echo "Fichier Gradle hita:"
          find "$PROJECT_DIR" -name "build.gradle*" -print

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Verify APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print
          test -n "$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TONONKIRA-APTM-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
